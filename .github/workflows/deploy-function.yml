name: Deploy Edge Function

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Edge function to deploy (e.g. send-email, optimize-route, scanner-clockin)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy function
        run: |
          supabase functions deploy ${{ github.event.inputs.function_name }} \
            --project-ref gmblbltckwipghqutkhw \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
